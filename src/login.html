<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Meeting - plugNmeet</title>

  <script src="./assets/config.js"></script>
  <link rel="icon" href="./assets/imgs/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif
    }

    html,
    body {
      height: 100%
    }

    body {
      display: flex;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
    }

    .container {
      margin: auto;
      max-width: 480px;
      width: 100%;
      padding: 20px
    }

    .logo {
      text-align: center;
      margin-bottom: 32px
    }

    .logo img {
      height: 50px;
      filter: brightness(0) invert(1)
    }

    .card {
      background: #fff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2)
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center
    }

    .card-subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 24px
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      color: #333;
      font-size: 14px
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
      transition: all 0.2s
    }

    input:focus {
      outline: none;
      border-color: #00a1f2;
      box-shadow: 0 0 0 4px rgba(0, 161, 242, 0.1)
    }

    .input-group {
      margin-bottom: 20px
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px
    }

    .role-btn {
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      color: #666
    }

    .role-btn:hover {
      border-color: #00a1f2;
      background: #f0f8ff
    }

    .role-btn.active {
      border-color: #00a1f2;
      background: #00a1f2;
      color: #fff
    }

    .role-btn.active:hover {
      background: #0088CC
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border: none;
      font-size: 16px;
      background: #00a1f2;
      transition: all 0.2s
    }

    .btn-primary:hover {
      background: #0088CC;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 161, 242, 0.3)
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none
    }

    .btn-danger {
      background: #fa3232;
      height: 40px;
      min-width: 100px;
      border-radius: 10px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border: none;
      font-size: 14px
    }

    .btn-danger:hover {
      background: #d62828
    }

    .status-info {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #e7f3ff;
      color: #0066cc;
      font-size: 14px;
      line-height: 1.6
    }

    .status-info strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px
    }

    .status-info.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb
    }

    .status-info.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb
    }

    .loading {
      opacity: 0.6;
      pointer-events: none
    }

    .error-text {
      color: #fa3232;
      font-size: 13px;
      margin-top: 4px;
      display: none
    }

    @media(max-width:480px) {
      .container {
        padding: 16px
      }

      .card {
        padding: 24px
      }

      .role-selector {
        grid-template-columns: 1fr
      }
    }

    @media(prefers-color-scheme:dark) {
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)
      }

      .card {
        background: #1e1e2e;
        border: 1px solid #333
      }

      label,
      input {
        color: #fff
      }

      input {
        background: #2a2a3a;
        border-color: #444
      }

      .role-btn {
        background: #2a2a3a;
        border-color: #444;
        color: #ccc
      }

      .role-btn:hover {
        border-color: #00a1f2
      }

      .status-info {
        background: #1a2a3a;
        color: #7cb3f0
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./assets/imgs/main-logo-light.png" />
    </div>

    <div class="card">
      <h1 class="card-title">Join Meeting</h1>
      <p class="card-subtitle">Enter room code and choose your role</p>

      <!-- Status messages -->
      <div id="status-message" class="status-info" style="display:none"></div>

      <!-- Room input (always visible) -->
      <div class="input-group">
        <label for="room_id">Room Code *</label>
        <input type="text" id="room_id" placeholder="Enter room code" autocomplete="off" required />
        <div class="error-text" id="room-error"></div>
      </div>

      <!-- Role selection -->
      <div class="role-selector">
        <button type="button" class="role-btn active" id="role-participant" data-role="participant">
          👤 Participant
        </button>
        <button type="button" class="role-btn" id="role-admin" data-role="admin">
          🔐 Administrator
        </button>
      </div>

      <!-- Participant form -->
      <div id="participant-section">
        <div class="input-group">
          <label for="name">Your Name *</label>
          <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required />
          <div class="error-text" id="name-error"></div>
        </div>
        <button type="button" id="join-btn" class="btn-primary">Join as Participant</button>
      </div>

      <!-- Admin section -->
      <div id="admin-section" style="display:none">
        <div id="admin-logged-out">
          <div class="status-info">
            <strong>Administrator Access</strong>
            Login with Keycloak to join as an administrator with full meeting controls.
          </div>
          <button type="button" id="keycloak-login-btn" class="btn-primary">Login with Keycloak</button>
        </div>
        <div id="admin-logged-in" style="display:none">
          <div class="status-info success">
            <strong>✓ You are logged in</strong>
            <span id="admin-user-name"></span>
          </div>
          <div style="display:flex;gap:10px">
            <button type="button" id="keycloak-logout-btn" class="btn-danger" style="flex:1">Logout</button>
            <button type="button" id="keycloak-continue-btn" class="btn-primary" style="flex:2">Continue to
              Room</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      /* ================= CONFIG ================= */
      const IGNORE_PARAMS = ['state', 'code', 'session_state', 'iss', 'error'];
      const STORAGE_KEY = 'pnm_query_params';

      const el = {
        room: document.getElementById('room_id'),
        name: document.getElementById('name'),
        roleParticipant: document.getElementById('role-participant'),
        roleAdmin: document.getElementById('role-admin'),
        participantSection: document.getElementById('participant-section'),
        adminSection: document.getElementById('admin-section'),
        adminLoggedOut: document.getElementById('admin-logged-out'),
        adminLoggedIn: document.getElementById('admin-logged-in'),
        adminUserName: document.getElementById('admin-user-name'),
        joinBtn: document.getElementById('join-btn'),
        keycloakLoginBtn: document.getElementById('keycloak-login-btn'),
        keycloakLogoutBtn: document.getElementById('keycloak-logout-btn'),
        keycloakContinueBtn: document.getElementById('keycloak-continue-btn'),
        statusMessage: document.getElementById('status-message'),
        roomError: document.getElementById('room-error'),
        nameError: document.getElementById('name-error')
      };

      let currentRole = 'participant';
      let keycloak = null;
      const kcCfg = window.plugNmeetConfig?.keycloak;
      const kcEnabled = kcCfg?.enabled;

      /* ================= UTILITIES ================= */
      const params = () => new URLSearchParams(location.search);
      const showError = (element, message) => {
        element.textContent = message;
        element.style.display = 'block';
      };
      const hideError = (element) => {
        element.style.display = 'none';
      };
      const showStatus = (message, type = 'info') => {
        el.statusMessage.textContent = message;
        el.statusMessage.className = `status-info ${type}`;
        el.statusMessage.style.display = 'block';
        setTimeout(() => el.statusMessage.style.display = 'none', 5000);
      };
      const setLoading = (loading) => {
        document.body.classList.toggle('loading', loading);
      };

      /* ================= QUERY PARAMS ================= */
      function persistParams() {
        const p = params();
        IGNORE_PARAMS.forEach(k => p.delete(k));
        if (p.toString()) sessionStorage.setItem(STORAGE_KEY, p.toString());
      }
      function restoreParams() {
        const saved = sessionStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const url = new URL(location.href);
        new URLSearchParams(saved).forEach((v, k) => {
          if (!url.searchParams.has(k)) url.searchParams.set(k, v);
        });
        history.replaceState({}, '', url);
      }
      restoreParams();

      /* ================= KEYCLOAK ================= */
      async function initKeycloak() {
        if (!kcEnabled) return false;
        persistParams();

        if (!window.Keycloak) {
          await new Promise(r => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/keycloak-js@25.0.4/dist/keycloak.min.js';
            s.onload = r;
            document.head.appendChild(s);
          });
        }

        keycloak = new Keycloak(kcCfg);
        const ok = await keycloak.init({ onLoad: 'check-sso', checkLoginIframe: false });
        restoreParams();
        return ok;
      }

      async function loginKeycloak() {
        persistParams();
        await keycloak.login({ redirectUri: location.href });
      }

      async function logoutKeycloak() {
        if (keycloak) await keycloak.logout();
        location.reload();
      }

      /* ================= ROLE SELECTION ================= */
      function switchRole(role) {
        currentRole = role;
        sessionStorage.setItem('pnm_selected_role', role);

        el.roleParticipant.classList.toggle('active', role === 'participant');
        el.roleAdmin.classList.toggle('active', role === 'admin');

        el.participantSection.style.display = role === 'participant' ? 'block' : 'none';
        el.adminSection.style.display = role === 'admin' ? 'block' : 'none';

        if (role === 'admin') {
          initAdminFlow();
        }
      }

      async function initAdminFlow() {
        if (!await initKeycloak()) {
          el.adminLoggedOut.style.display = 'block';
          el.adminLoggedIn.style.display = 'none';
          return;
        }

        const t = keycloak.tokenParsed || {};
        const name = t.preferred_username || t.name ||
          [t.given_name, t.family_name].filter(Boolean).join(' ') || 'Admin';

        el.adminUserName.textContent = `as ${name}`;
        el.adminLoggedOut.style.display = 'none';
        el.adminLoggedIn.style.display = 'block';
      }

      /* ================= USER INFO ================= */
      function getAdminUser() {
        const t = keycloak.tokenParsed || {};
        const name = t.preferred_username || t.name ||
          [t.given_name, t.family_name].filter(Boolean).join(' ');
        return { is_admin: true, name: name || 'admin', user_id: t.sub };
      }

      function getParticipantUser() {
        const name = el.name.value.trim();
        const userId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
        return { is_admin: false, name: name, user_id: userId };
      }

      /* ================= VALIDATION ================= */
      function validateForm() {
        let valid = true;

        if (!el.room.value.trim()) {
          showError(el.roomError, 'Room code is required');
          valid = false;
        } else {
          hideError(el.roomError);
        }

        if (currentRole === 'participant' && !el.name.value.trim()) {
          showError(el.nameError, 'Name is required');
          valid = false;
        } else {
          hideError(el.nameError);
        }

        return valid;
      }

      /* ================= JOIN ROOM ================= */
      async function joinRoom(roomId, user) {
        if (!validateForm()) return;

        setLoading(true);
        showStatus('Connecting to room...', 'info');

        try {
          const server = window.plugNmeetConfig.serverUrl;
          const headers = { 'Content-Type': 'application/json' };

          let authPath = '/participant-auth/auth/';
          if (user.is_admin) {
            await keycloak.updateToken(30);
            headers.Authorization = 'Bearer ' + keycloak.token;
            authPath = '/keycloak-auth/auth/';
          }

          const post = (m, b) => fetch(server + authPath + m, {
            method: 'POST', headers, body: JSON.stringify(b)
          }).then(r => r.json());

          const active = await post('room/isRoomActive', { room_id: roomId });
          if (!active.is_active) {
            await post('room/create', {
              room_id: roomId,
              empty_timeout: 7200,
              metadata: window.DEFAULT_ROOM_METADATA
            });
          }

          const join = await post('room/getJoinToken', { room_id: roomId, user_info: user });
          location.href = '/?access_token=' + join.token;
        } catch (error) {
          setLoading(false);
          showStatus('Failed to join room. Please try again.', 'error');
          console.error('Join error:', error);
        }
      }

      /* ================= EVENT HANDLERS ================= */
      el.roleParticipant.onclick = () => switchRole('participant');
      el.roleAdmin.onclick = () => switchRole('admin');
      el.joinBtn.onclick = () => {
        const room = el.room.value.trim();
        if (!room) return;
        joinRoom(room, getParticipantUser());
      };
      el.keycloakLoginBtn.onclick = loginKeycloak;
      el.keycloakLogoutBtn.onclick = logoutKeycloak;
      el.keycloakContinueBtn.onclick = () => {
        const room = el.room.value.trim();
        if (!room) return;
        joinRoom(room, getAdminUser());
      };

      /* ================= INITIALIZE ================= */
      async function start() {
        const room = params().get('room_id');
        const name = params().get('name');
        const isAdminParam = params().has('joinasadmin');

        // Pre-fill from URL
        if (room) el.room.value = room;
        if (name) el.name.value = name;

        // Auto-join if all params present
        if (room && name && !isAdminParam) {
          joinRoom(room, getParticipantUser());
          return;
        }

        // Admin flow from URL or Saved State
        const savedRole = sessionStorage.getItem('pnm_selected_role');

        if (isAdminParam || savedRole === 'admin') {
          switchRole('admin');
          if (room) el.room.value = room;
          return;
        }

        // Default: show participant form
        switchRole('participant');
      }

      start();
    })();
  </script>
</body>

</html>
