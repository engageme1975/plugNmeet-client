<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Meeting - Connect AI</title>

  <script src="./assets/config.js"></script>
  <link rel="icon" href="./assets/imgs/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif
    }

    html,
    body {
      height: 100%
    }

    body {
      display: flex;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
    }

    .container {
      margin: auto;
      max-width: 480px;
      width: 100%;
      padding: 20px
    }

    .logo {
      text-align: center;
      margin-bottom: 32px
    }

    .logo img {
      height: 50px;
      filter: brightness(0) invert(1)
    }

    .card {
      background: #fff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2)
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center
    }

    .card-subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 24px
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      color: #333;
      font-size: 14px
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
      transition: all 0.2s
    }

    input:focus {
      outline: none;
      border-color: #00a1f2;
      box-shadow: 0 0 0 4px rgba(0, 161, 242, 0.1)
    }

    .input-group {
      margin-bottom: 20px
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px
    }

    .role-btn {
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      color: #666
    }

    .role-btn:hover {
      border-color: #00a1f2;
      background: #f0f8ff
    }

    .role-btn.active {
      border-color: #00a1f2;
      background: #00a1f2;
      color: #fff
    }

    .role-btn.active:hover {
      background: #0088CC
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border: none;
      font-size: 16px;
      background: #00a1f2;
      transition: all 0.2s
    }

    .btn-primary:hover {
      background: #0088CC;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 161, 242, 0.3)
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none
    }

    .btn-danger {
      background: #fa3232;
      height: 40px;
      min-width: 100px;
      border-radius: 10px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border: none;
      font-size: 14px
    }

    .btn-danger:hover {
      background: #d62828
    }

    .status-info {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #e7f3ff;
      color: #0066cc;
      font-size: 14px;
      line-height: 1.6
    }

    .status-info strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px
    }

    .status-info.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb
    }

    .status-info.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb
    }

    .loading {
      opacity: 0.6;
      pointer-events: none
    }

    .error-text {
      color: #fa3232;
      font-size: 13px;
      margin-top: 4px;
      display: none
    }

    @media(max-width:480px) {
      .container {
        padding: 16px
      }

      .card {
        padding: 24px
      }

      .role-selector {
        grid-template-columns: 1fr
      }
    }

    @media(prefers-color-scheme:dark) {
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)
      }

      .card {
        background: #1e1e2e;
        border: 1px solid #333
      }

      label,
      input {
        color: #fff
      }

      input {
        background: #2a2a3a;
        border-color: #444
      }

      .role-btn {
        background: #2a2a3a;
        border-color: #444;
        color: #ccc
      }

      .role-btn:hover {
        border-color: #00a1f2
      }

      .status-info {
        background: #1a2a3a;
        color: #7cb3f0
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./assets/imgs/main-logo-light.png" />
    </div>

    <div class="card">
      <h1 class="card-title">Join Meeting</h1>
      <p class="card-subtitle">Enter room code and choose your role</p>

      <!-- Status messages -->
      <div id="status-message" class="status-info" style="display:none"></div>

      <!-- Room input (always visible) -->
      <div class="input-group">
        <label for="room_id">Room Code *</label>
        <input type="text" id="room_id" placeholder="Enter room code" autocomplete="off" required />
        <div class="error-text" id="room-error"></div>
      </div>

      <!-- Role selection -->
      <div class="role-selector">
        <button type="button" class="role-btn active" id="role-participant" data-role="participant">
          👤 Participant
        </button>
        <button type="button" class="role-btn" id="role-admin" data-role="admin">
          🔐 Administrator
        </button>
      </div>

      <!-- Participant form -->
      <div id="participant-section">
        <div class="input-group">
          <label for="name">Your Name *</label>
          <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required />
          <div class="error-text" id="name-error"></div>
        </div>
        <button type="button" id="join-btn" class="btn-primary">Join as Participant</button>
      </div>

      <!-- Admin section -->
      <div id="admin-section" style="display:none">
        <div id="admin-logged-out">
          <div class="status-info">
            <strong>Administrator Access</strong>
            Login with Keycloak to join as an administrator with full meeting controls.
          </div>
          <button type="button" id="keycloak-login-btn" class="btn-primary">Login with Keycloak</button>
        </div>
        <div id="admin-logged-in" style="display:none">
          <div class="status-info success">
            <strong>✓ You are logged in</strong>
            <span id="admin-user-name"></span>
          </div>
          <div style="display:flex;gap:10px">
            <button type="button" id="keycloak-logout-btn" class="btn-danger" style="flex:1">Logout</button>
            <button type="button" id="keycloak-continue-btn" class="btn-primary" style="flex:2">Continue to
              Room</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      /* ================= CONFIG ================= */
      const IGNORE_PARAMS = ['state', 'code', 'session_state', 'iss', 'error'];

      const el = {
        room: document.getElementById('room_id'),
        name: document.getElementById('name'),
        roleParticipant: document.getElementById('role-participant'),
        roleAdmin: document.getElementById('role-admin'),
        participantSection: document.getElementById('participant-section'),
        adminSection: document.getElementById('admin-section'),
        adminLoggedOut: document.getElementById('admin-logged-out'),
        adminLoggedIn: document.getElementById('admin-logged-in'),
        adminUserName: document.getElementById('admin-user-name'),
        joinBtn: document.getElementById('join-btn'),
        keycloakLoginBtn: document.getElementById('keycloak-login-btn'),
        keycloakLogoutBtn: document.getElementById('keycloak-logout-btn'),
        keycloakContinueBtn: document.getElementById('keycloak-continue-btn'),
        statusMessage: document.getElementById('status-message'),
        roomError: document.getElementById('room-error'),
        nameError: document.getElementById('name-error')
      };

      let currentRole = 'participant';
      let keycloak = null;
      const kcCfg = window.plugNmeetConfig?.keycloak;
      const kcEnabled = kcCfg?.enabled;

      // Define default room metadata if not already set
      if (!window.DEFAULT_ROOM_METADATA) {
        window.DEFAULT_ROOM_METADATA = {
          room_title: 'Meeting Room',
          welcome_message: 'Welcome to the meeting!<br /> To share microphone click mic icon from bottom left side.',
          room_features: {
            allow_webcams: true,
            mute_on_start: false,
            allow_screen_share: true,
            allow_rtmp: true,
            admin_only_webcams: false,
            allow_view_other_webcams: true,
            allow_view_other_users_list: true,
            room_duration: 0,
            enable_analytics: true,
            allow_virtual_bg: true,
            allow_raise_hand: true,
            recording_features: {
              is_allow: true,
              is_allow_cloud: true,
              is_allow_local: true,
              enable_auto_cloud_recording: false,
              only_record_admin_webcams: false,
            },
            chat_features: {
              is_allow: true,
              is_allow_file_upload: true,
              max_file_size: 50,
              allowed_file_types: ['jpg', 'png', 'zip', 'pdf'],
            },
            shared_note_pad_features: {
              is_allow: true,
            },
            whiteboard_features: {
              is_allow: true,
            },
            external_media_player_features: {
              is_allow: true,
            },
            waiting_room_features: {
              is_active: true,
            },
            breakout_room_features: {
              is_allow: true,
              allowed_number_rooms: 6,
            },
            display_external_link_features: {
              is_allow: true,
            },
            ingress_features: {
              is_allow: true,
            },
            polls_features: {
              is_allow: true,
            },
            insights_features: {
              is_allow: true,
              transcription_features: {
                is_allow: true,
                is_allow_translation: true,
                is_allow_speech_synthesis: true,
              },
              chat_translation_features: {
                is_allow: true,
              },
              ai_features: {
                is_allow: true,
                ai_text_chat_features: {
                  is_allow: true,
                },
                meeting_summarization_features: {
                  is_allow: true,
                },
              },
            },
            end_to_end_encryption_features: {
              is_enabled: false,
              included_chat_messages: false,
              included_whiteboard: false,
              enabled_self_insert_encryption_key: false,
            },
          },
        };
      }

      /* ================= UTILITIES ================= */
      const params = () => new URLSearchParams(location.search);
      const showError = (element, message) => {
        element.textContent = message;
        element.style.display = 'block';
      };
      const hideError = (element) => {
        element.style.display = 'none';
      };
      const showStatus = (message, type = 'info') => {
        el.statusMessage.textContent = message;
        el.statusMessage.className = `status-info ${type}`;
        el.statusMessage.style.display = 'block';
        setTimeout(() => el.statusMessage.style.display = 'none', 5000);
      };
      const setLoading = (loading) => {
        document.body.classList.toggle('loading', loading);
      };

      /* ================= QUERY PARAMS ================= */
      function persistParams() {
        // Query params are preserved in the redirect URI, no need for sessionStorage
        const p = params();
        IGNORE_PARAMS.forEach(k => p.delete(k));
      }
      function restoreParams() {
        // Query params are already in the URL after Keycloak redirect
        // Just clean up OAuth params that Keycloak adds
        const url = new URL(location.href);
        let modified = false;
        IGNORE_PARAMS.forEach(k => {
          if (url.searchParams.has(k)) {
            url.searchParams.delete(k);
            modified = true;
          }
        });
        if (modified) {
          history.replaceState({}, '', url);
        }
      }
      restoreParams();

      /* ================= KEYCLOAK ================= */
      async function initKeycloak() {
        if (!kcEnabled) return false;
        persistParams();

        if (!window.Keycloak) {
          await new Promise(r => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/keycloak-js@25.0.4/dist/keycloak.min.js';
            s.onload = r;
            s.onerror = () => {
              console.error('Failed to load local Keycloak script, falling back to CDN');
              s.src = 'https://cdn.jsdelivr.net/npm/keycloak-js@25.0.4/dist/keycloak.min.js';
            };
            document.head.appendChild(s);
          });
        }

        keycloak = new Keycloak(kcCfg);

        // Initialize Keycloak with check-sso (without silent SSO redirect URI)
        // If silent-check-sso.html is not configured in Keycloak, it will fail
        // So we use regular check-sso which works without the redirect URI
        let ok = false;
        try {
          const initPromise = keycloak.init({
            // onLoad: 'check-sso', // Manual check implemented in start()
            pkceMethod: 'S256',
            enableLogging: false, // Set to true for debugging
            checkLoginIframe: false
          });

          // Add timeout (5 seconds) - if init hangs, treat as failed
          const timeoutPromise = new Promise((resolve) => {
            setTimeout(() => resolve(false), 5000);
          });

          ok = await Promise.race([initPromise, timeoutPromise]);
        } catch (err) {
          // If init fails, continue without SSO - user can manually log in
          console.warn('Keycloak init failed:', err.message);
          ok = false;
          // Keycloak instance still exists, just not authenticated
          // This allows manual login later
        }

        // Clean up OAuth params from hash after processing (if any)
        const hash = window.location.hash.substring(1);
        if (hash.includes('code=') || hash.includes('state=')) {
          const url = new URL(location.href);
          url.hash = ''; // Remove hash after Keycloak processes it
          history.replaceState({}, '', url);
        }

        restoreParams();
        return ok;
      }

      async function loginKeycloak() {
        persistParams();

        // Initialize Keycloak if not already initialized
        if (!keycloak) {
          await initKeycloak();
        }

        if (keycloak && keycloak.authenticated) {
          // Already logged in via SSO
          initAdminFlow();
          return;
        }

        if (!keycloak) {
          showStatus('Keycloak not available', 'error');
          return;
        }

        // Preserve all query params in redirect URI
        const redirectUri = new URL(location.href);
        IGNORE_PARAMS.forEach(k => redirectUri.searchParams.delete(k));

        // Don't use prompt parameter - let Keycloak handle SSO automatically
        // If user is already logged in, it will use SSO silently
        // If not logged in, it will show login screen
        await keycloak.login({
          redirectUri: redirectUri.toString()
        });
      }

      async function logoutKeycloak() {
        if (keycloak) await keycloak.logout();
        location.reload();
      }

      /* ================= ROLE SELECTION ================= */
      async function switchRole(role) {
        currentRole = role;

        // Update URL with role parameter instead of sessionStorage
        const url = new URL(location.href);
        if (role === 'admin') {
          url.searchParams.set('role', 'admin');
        } else {
          url.searchParams.delete('role');
        }
        history.replaceState({}, '', url);

        el.roleParticipant.classList.toggle('active', role === 'participant');
        el.roleAdmin.classList.toggle('active', role === 'admin');

        el.participantSection.style.display = role === 'participant' ? 'block' : 'none';
        el.adminSection.style.display = role === 'admin' ? 'block' : 'none';

        if (role === 'admin') {
          await initAdminFlow();
        }
      }

      async function initAdminFlow() {
        // Always start by hiding both sections to prevent both showing
        el.adminLoggedOut.style.display = 'none';
        el.adminLoggedIn.style.display = 'none';

        // Check if we're processing an OAuth callback (prevent loops)
        const hash = window.location.hash.substring(1);
        const hasOAuthCallback = hash.includes('code=') || hash.includes('state=');

        // Initialize Keycloak if not already initialized
        if (!keycloak) {
          try {
            const initResult = await initKeycloak();
            // If Keycloak is not enabled, show login button
            if (!kcEnabled) {
              el.adminLoggedOut.style.display = 'block';
              return;
            }
            // If keycloak instance was not created, show login button
            if (!keycloak) {
              el.adminLoggedOut.style.display = 'block';
              return;
            }
            // If init failed but keycloak exists, continue to check authentication
            // (user can still manually log in)
          } catch (err) {
            // If initialization throws an error, show login button
            console.warn('Keycloak initialization error:', err);
            el.adminLoggedOut.style.display = 'block';
            return;
          }
        }

        // Ensure keycloak exists before checking authentication
        if (!keycloak) {
          el.adminLoggedOut.style.display = 'block';
          return;
        }

        // If we have OAuth callback, wait for it to be processed
        if (hasOAuthCallback) {
          // Wait for Keycloak to process the OAuth callback
          // Poll for authentication status (max 2 seconds)
          let attempts = 0;
          while (attempts < 20 && !keycloak.authenticated) {
            await new Promise(resolve => setTimeout(resolve, 100));
            attempts++;
          }
        }

        // Check if user is already authenticated
        // keycloak.authenticated is explicitly true when logged in, false or undefined when not
        const isAuthenticated = keycloak && keycloak.authenticated === true;

        if (isAuthenticated) {
          const t = keycloak.tokenParsed || {};
          const name =
            t.preferred_username ||
            t.name ||
            [t.given_name, t.family_name].filter(Boolean).join(' ') ||
            'Admin';

          el.adminUserName.textContent = `as ${name}`;
          el.adminLoggedIn.style.display = 'block';

          // Auto-join if room_id and joinasadmin are present
          const urlParams = new URLSearchParams(window.location.search);
          const room = urlParams.get('room_id');
          // Treat any presence of joinasadmin as true, consistent with start() logic
          const joinAsAdmin = urlParams.has('joinasadmin');

          if (room && joinAsAdmin) {
            console.log('Auto-joining room as admin...');
            joinRoom(room, getAdminUser());
          }
        } else {
          // User is not authenticated - show login button
          // BUT: Don't auto-trigger login if we just processed an OAuth callback
          // (this prevents redirect loops)
          el.adminLoggedOut.style.display = 'block';
        }
      }

      /* ================= USER INFO ================= */
      function getAdminUser() {
        const t = keycloak.tokenParsed || {};
        const name = t.preferred_username || t.name ||
          [t.given_name, t.family_name].filter(Boolean).join(' ');
        return { is_admin: true, name: name || 'admin', user_id: t.sub };
      }

      function getParticipantUser() {
        const name = el.name.value.trim();
        const userId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
        return { is_admin: false, name: name, user_id: userId };
      }

      /* ================= VALIDATION ================= */
      function validateForm() {
        let valid = true;

        if (!el.room.value.trim()) {
          showError(el.roomError, 'Room code is required');
          valid = false;
        } else {
          hideError(el.roomError);
        }

        if (currentRole === 'participant' && !el.name.value.trim()) {
          showError(el.nameError, 'Name is required');
          valid = false;
        } else {
          hideError(el.nameError);
        }

        return valid;
      }

      /* ================= JOIN ROOM ================= */
      async function joinRoom(roomId, user) {
        if (!validateForm()) return;

        setLoading(true);
        showStatus('Connecting to room...', 'info');

        try {
          const server = window.plugNmeetConfig.serverUrl;
          const headers = { 'Content-Type': 'application/json' };

          let authPath = '/participant-auth/auth/';
          if (user.is_admin) {
            await keycloak.updateToken(30);
            headers.Authorization = 'Bearer ' + keycloak.token;
            authPath = '/keycloak-auth/auth/';
          }

          const post = async (m, b) => {
            const res = await fetch(server + authPath + m, {
              method: 'POST', headers, body: JSON.stringify(b)
            });

            if (!res.ok) {
              throw new Error(`${m} failed with status ${res.status}`);
            }

            return res.json();
          };

          const active = await post('room/isRoomActive', { room_id: roomId });
          if (!active.is_active) {
            const metadata = { ...window.DEFAULT_ROOM_METADATA };
            metadata.room_title = roomId;
            await post('room/create', {
              room_id: roomId,
              empty_timeout: 7200,
              metadata: metadata
            });
          }

          const join = await post('room/getJoinToken', { room_id: roomId, user_info: user });
          if (!join || !join.token) {
            const reason = join?.message || join?.error || 'No token returned';
            throw new Error(`getJoinToken missing token: ${reason}`);
          }

          location.href = '/?access_token=' + join.token;
        } catch (error) {
          setLoading(false);
          showStatus('Failed to join room. Please try again.', 'error');
          console.error('Join error:', error);
        }
      }

      /* ================= EVENT HANDLERS ================= */
      el.roleParticipant.onclick = () => switchRole('participant');
      el.roleAdmin.onclick = () => switchRole('admin');
      el.joinBtn.onclick = () => {
        const room = el.room.value.trim();
        if (!room) return;
        joinRoom(room, getParticipantUser());
      };
      el.keycloakLoginBtn.onclick = loginKeycloak;
      el.keycloakLogoutBtn.onclick = logoutKeycloak;
      el.keycloakContinueBtn.onclick = () => {
        const room = el.room.value.trim();
        if (!room) return;
        joinRoom(room, getAdminUser());
      };

      /* ================= INITIALIZE ================= */
      async function start() {
        const room = params().get('room_id');
        const name = params().get('name');
        const isAdminParam = params().has('joinasadmin');
        const roleParam = params().get('role'); // Get role from query param

        // Pre-fill from URL
        if (room) el.room.value = room;
        if (name) el.name.value = name;

        // Auto-join if all params present
        if (room && name && !isAdminParam && roleParam !== 'admin') {
          joinRoom(room, getParticipantUser());
          return;
        }

        // Check for existing Keycloak session first
        if (kcEnabled) {
          try {
            await initKeycloak();
            // init() with pkce will handle the code exchange if coming back from login
            if (keycloak && keycloak.authenticated) {
              await switchRole('admin');
              return;
            }

            // Manual check-sso preserving query params
            const ssoChecked = sessionStorage.getItem('pnm_sso_checked');
            const urlParams = new URLSearchParams(window.location.search);
            const hasError = urlParams.has('error');

            if (!ssoChecked && !hasError) {
              sessionStorage.setItem('pnm_sso_checked', '1');

              // Preserve current URL params but strip OIDC params
              const redirectUrl = new URL(window.location.href);
              redirectUrl.hash = ''; // Ensure no fragment in redirect_uri
              IGNORE_PARAMS.forEach(k => redirectUrl.searchParams.delete(k));
              const targetUri = redirectUrl.toString();

              console.log('Checking session with URI:', targetUri);
              await keycloak.login({
                prompt: 'none',
                redirectUri: targetUri
              });
              return;
            }
          } catch (e) {
            console.warn('Manual session check failed', e);
          }
        }

        // Admin flow from URL query params
        if (isAdminParam || roleParam === 'admin') {
          if (room) el.room.value = room;
          // switchRole already calls initAdminFlow, no need to call it again
          await switchRole('admin');
          return;
        }

        // Default: show participant form
        switchRole('participant');
      }

      start();
    })();
  </script>
